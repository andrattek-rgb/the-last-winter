<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Last Winter</title>
  <link rel="stylesheet" href="portal.css">
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <main class="portal">
    <section class="account" id="account" aria-labelledby="title">
      <h1 id="title">The Last Winter</h1>
      <form id="auth-form" hidden>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div class="actions">
          <button type="submit" name="action" value="login">Sign in</button>
          <button class="secondary" type="submit" name="action" value="register">Create account</button>
        </div>
      </form>
      <div id="profile" hidden>
        <p id="checkpoint"></p>
        <button id="play" type="button">Play</button>
      </div>
      <p id="notice" role="status" aria-live="polite">Checking your session…</p>
    </section>
    <section id="game" class="game" aria-label="Game" hidden>
      <canvas id="canvas" width="1280" height="720" tabindex="0">Your browser must support WebGL 2.</canvas>
      <progress id="download" aria-label="Loading the game"></progress>
    </section>
    <footer id="session-controls" hidden>
      <small id="save-status" role="status" aria-live="polite"></small>
      <button id="retry" class="secondary" type="button" hidden>Retry save</button>
      <button id="logout" class="secondary" type="button">Sign out</button>
    </footer>
  </main>
  <script src="$GODOT_URL"></script>
  <script>window.winterEngineConfig = $GODOT_CONFIG;</script>
  <script type="module" src="portal.js"></script>
</body>
</html>
